# MinDatabase - Medieval Art & Artists Repository Configuration

repository: xkkxsn56sn-bot/MinDatabase
title: MinDatabase
description: A scholarly knowledge repository documenting medieval Italian artists from the 13th-14th centuries (Duecento/Trecento periods)
url: https://medievalvisions.com
email: contact@medievalvisions.com
baseurl: ""

# Build settings
markdown: kramdown

# Parole al minuto per la stima di lettura (_includes/reading-stat.html)
reading_wpm: 250

# Include all markdown files from Content directory
include:
  - Content
  # Cloudflare Workers Static Assets: intestazioni e file da non pubblicare
  # (vedi wrangler.site.toml). Jekyll scarta i file che iniziano con _ o .
  - _headers
  - .assetsignore

# Default front matter deleted to force Jekyll to process all markdown files in the Content directory, ensuring they are included in the site build.

# Base degli zoom ad alta risoluzione, prefissata ai data-zoom-src da
# _includes/image-zoom.html. Gli zoom non stanno nel repository ma su R2
# (bucket mindatabase-zoom): la base e' la stessa in locale e in produzione,
# cosi' anche l'anteprima locale li apre. _config.production.yml la ripete.
zoom_base: "https://zoom.medievalvisions.com"

# Exclude from processing
exclude:
  - scripts/
  - cloudflare/
  - Zoom/
  - .gitignore
  - README.md
  - newsletter_subscribers.csv
  - drafts/
  - vendor/
  - Gemfile
  - Gemfile.lock

# Jekyll Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Force rebuild to include all recent fixes
