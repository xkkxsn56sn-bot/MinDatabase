# MinDatabase - Medieval Art & Artists Repository Configuration

title: MinDatabase
description: A scholarly knowledge repository documenting medieval Italian artists from the 13th-14th centuries (Duecento/Trecento periods)
url: https://medievalvisions.com
baseurl: ""

# Build settings
theme: minima
markdown: kramdown

# Include all markdown files from Content directory
include:
  - Content

# Default front matter is differentiated by directory to apply specific layouts
defaults:
  - scope:
      path: "Content/Artists"
    values:
      layout: "artist-profile"
  - scope:
      path: "Content/Churches"
    values:
      layout: "church-profile"

# Exclude from processing
exclude:
  - scripts/
  - .gitignore
  - README.md

# Jekyll Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Force rebuild to include all recent fixes
