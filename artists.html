<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artists Directory - Medieval Visions</title>
    <link rel="stylesheet" href="assets/css/directory-base.css" />
    <link rel="stylesheet" href="/assets/css/nav.css" />
    <style>
      .century-section {
        background: white;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem 2rem;
      }

      .century-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        margin: 1rem 0 2rem;
      }

      .century-nav a {
        display: inline-block;
        padding: 0.35rem 0.75rem;
        border: 1px solid #d6c6a3;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.9rem;
      }

      .century-nav a:hover {
        background: #f9f3e7;
      }

      .century-section h2 {
        margin-top: 0;
        margin-bottom: 1rem;
      }

      ul {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem 1.25rem;
      }

      li {
        line-height: 1.45;
      }

      li a {
        text-underline-offset: 2px;
      }

      li::before {
        content: "✦ ";
        color: var(--gold);
      }

      @media (max-width: 600px) {
        ul {
          grid-template-columns: 1fr;
        }

        .century-section {
          padding: 1rem;
        }
      }

      @media (min-width: 601px) and (max-width: 900px) {
        ul {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Artists Directory</h1>
    </header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="churches.html">Churches</a>
      <a href="codices.html">Codices</a>
      <a href="papers.html">Papers</a>
    </nav>
    <nav
      class="century-nav"
      id="century-nav"
      aria-label="Jump to century"
    ></nav>
    <main>
      <div id="century-sections"></div>
      <noscript>
        <section class="century-section">
          <p>This page requires JavaScript to render the artist list.</p>
        </section>
      </noscript>

      <a href="index.html" class="back-btn">Back to Home</a>
    </main>

    <footer class="site-footer">
      <p><strong>Medieval Visions</strong> - Medieval Artistic Dataset</p>
      <p>
        A collaborative scholarly project documenting medieval art and artists
      </p>
    </footer>

    <script src="assets/js/artists-directory.js" defer></script>
    <script src="/assets/js/gregorian-player.js" defer></script>
    <script src="/assets/js/visitor-counter.js" defer></script>
  </body>
</html>
