  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="/endnotes.html" />

    <!--
      The notes formerly on ancient-world.html were merged into endnotes.html.
      Every fn- anchor kept its id, so the fragment is carried across verbatim.
      The script runs first and preserves the hash; the meta refresh below is
      the no-JavaScript fallback and can only reach the top of the page.
    -->
    <script>
      location.replace("/endnotes.html" + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/endnotes.html" />
  </head>

    <p>
      These notes now live in
      <a href="/endnotes.html">endnotes.html</a>. Redirecting…
    </p>
