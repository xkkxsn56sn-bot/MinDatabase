<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illuminated Codices - Medieval Visions</title>
    <link rel="stylesheet" href="assets/css/directory-base.css" />
    <link rel="stylesheet" href="/assets/css/nav.css" />
    <style>
      .section-card {
        background: white;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .entry-list {
        -webkit-columns: 3;
        columns: 3;
        column-gap: 2rem;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .entry-list li {
        break-inside: avoid;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--dark-parchment);
      }

      .entry-list li:last-child {
        border-bottom: none;
      }

      li::before {
        content: "✦ ";
        color: var(--gold);
      }

      @media (max-width: 900px) {
        .entry-list {
          columns: 2;
        }
      }

      @media (max-width: 600px) {
        .entry-list {
          columns: 1;
        }

        .section-card {
          padding: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Illuminated Codices</h1>
    </header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="churches.html">Churches</a>
      <a href="codices.html">Codices</a>
      <a href="papers.html">Papers</a>
    </nav>
    <main>
      <div class="section-card">
        <h2 id="codices-heading">Manuscripts & Visionary Works</h2>
        <ul class="entry-list" id="codices-list"></ul>
      </div>

      <a href="index.html" class="back-btn">Back to Home</a>
    </main>

    <footer class="site-footer">
      <p><strong>Medieval Visions</strong> - Medieval Artistic Dataset</p>
      <p>
        A collaborative scholarly project documenting medieval art and artists
      </p>
    </footer>

    <script src="/assets/js/codices-directory.js" defer></script>
    <script src="/assets/js/gregorian-player.js" defer></script>
    <script src="/assets/js/visitor-counter.js" defer></script>
  </body>
</html>
