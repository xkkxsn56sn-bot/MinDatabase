<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - Medieval Visions</title>
    <link rel="stylesheet" href="assets/css/directory-base.css" />
    <link rel="stylesheet" href="{{ '/assets/css/nav.css' | relative_url }}" />
    <style>
      .churches-intro,
      .churches-catalog {
        background: white;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .churches-list {
        list-style: none;
        padding: 0;
        margin: 0;
        columns: 3;
        column-gap: 2rem;
      }

      .churches-list li {
        break-inside: avoid;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--dark-parchment);
      }

      .churches-list li:last-child {
        border-bottom: none;
      }

      .churches-list li::before {
        content: "✦ ";
        color: var(--gold);
      }

      @media (max-width: 900px) {
        .churches-list {
          columns: 2;
        }
      }

      @media (max-width: 600px) {
        .churches-list {
          columns: 1;
        }

        .churches-intro,
        .churches-catalog {
          padding: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>{{ page.title }}</h1>
    </header>
    {% include nav.html %}
    <main>
      {{ content }}
      <a href="index.html" class="back-btn">Back to Home</a>
    </main>
    <footer class="site-footer">
      <p><strong>Medieval Visions</strong> - Medieval Artistic Dataset</p>
      <p>
        A collaborative scholarly project documenting medieval art and artists
      </p>
    </footer>
    <script src="/assets/js/gregorian-player.js" defer></script>
    <script src="/assets/js/visitor-counter.js" defer></script>
  </body>
</html>
