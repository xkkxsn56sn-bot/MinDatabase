<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | Medieval Visions</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/entry.css' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/endnotes.css' | relative_url }}"
    />
  </head>

  <body>
    <div class="endnotes-page">
      <header class="endnotes-page__header">
        <h1 class="endnotes-page__title">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p class="endnotes-page__subtitle">{{ page.subtitle }}</p>
        {% endif %}
        <button
          id="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          class="endnotes-page__theme-toggle"
        >
          Day / Night mode
        </button>
      </header>

      {{ content }}

      <nav class="endnotes-page__nav-footer" aria-label="Page navigation">
        <a href="{{ '/' | relative_url }}" class="endnotes-page__nav-btn"
          >← Back to Home</a
        >
      </nav>
    </div>

    <script>
      (function () {
        const STORAGE_KEY = "site-theme";
        const html = document.documentElement;
        const toggleBtn = document.getElementById("theme-toggle");

        function getPreferredTheme() {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored === "light" || stored === "dark") return stored;
          return "light";
        }

        function applyTheme(theme) {
          html.setAttribute("data-theme", theme);
          localStorage.setItem(STORAGE_KEY, theme);
        }

        applyTheme(getPreferredTheme());

        if (toggleBtn) {
          toggleBtn.addEventListener("click", function () {
            const next =
              html.getAttribute("data-theme") === "light" ? "dark" : "light";
            applyTheme(next);
          });
        }
      })();
    </script>

    <script>
      (function () {
        const input = document.getElementById("endnotes-search-input");
        const clearBtn = document.getElementById("endnotes-search-clear");
        const items = document.querySelectorAll(".endnotes-list__item");
        const noResults = document.getElementById("endnotes-no-results");
        const sections = document.querySelectorAll(".endnotes-section");

        if (!input) return;

        function filterNotes(query) {
          const q = query.toLowerCase().trim();
          let anyVisible = false;

          items.forEach(function (item) {
            const visible = !q || item.textContent.toLowerCase().includes(q);
            item.classList.toggle("endnotes-list__item--hidden", !visible);
            if (visible) anyVisible = true;
          });

          sections.forEach(function (sec) {
            const visibleItems = sec.querySelectorAll(
              ".endnotes-list__item:not(.endnotes-list__item--hidden)",
            );
            sec.style.display = visibleItems.length ? "" : "none";
          });

          if (noResults) {
            noResults.classList.toggle(
              "endnotes-no-results--visible",
              !anyVisible,
            );
          }
        }

        input.addEventListener("input", function () {
          filterNotes(this.value);
          if (clearBtn) clearBtn.hidden = !this.value;
        });

        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            input.value = "";
            filterNotes("");
            clearBtn.hidden = true;
            input.focus();
          });
        }
      })();
    </script>

    <script
      src="{{ '/assets/js/amended-on.js' | relative_url }}"
      defer
    ></script>
    <script
      src="{{ '/assets/js/visitor-counter.js' | relative_url }}"
      defer
    ></script>
  </body>
</html>
