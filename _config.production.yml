# Sovrascritture di produzione, aggiunte a _config.yml dalle build di
# .github/workflows/deploy-pages.yml (GitHub Pages e Cloudflare):
#   bundle exec jekyll build --config _config.yml,_config.production.yml
# In locale non serve: _config.yml ha gia' gli stessi valori.

# Gli zoom vivono su R2 (bucket mindatabase-zoom), pubblicati su questo dominio.
