name: Validate content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate content indexes
        run: python3 scripts/validate_content_indexes.py

      - name: Validate scholars frontmatter
        run: python3 scripts/validate_scholars_frontmatter.py

      - name: Validate reachability
        run: python3 scripts/validate_reachability.py

      - name: Validate nav consistency
        run: python3 scripts/validate_nav_consistency.py

      # Non e' un validatore di contenuto: sorveglia la toolchain delle
      # notizie. Sta qui perche' validate.yml e' l'unico workflow senza
      # filtri di path, quindi la batteria gira sullo stesso push che porta
      # una modifica a update_push_notices.py o a send_newsletter_updates.py.
      - name: Push-notices regression battery
        run: python3 scripts/test_update_push_notices.py
