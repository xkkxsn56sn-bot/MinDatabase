name: Update Gallery Index

on:
  push:
    branches:
      - main
      - master
    paths:
      # Le figure vivono nelle schede; le immagini contano solo se una scheda
      # le referenzia, quindi il trigger guarda i .md. Si include comunque
      # lo script, cosi' una sua modifica rigenera l'indice.
      - "Content/**/*.md"
      - "scripts/build_gallery_index.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build gallery index
        run: python scripts/build_gallery_index.py

      - name: Commit updated gallery index
        run: |
          if git diff --quiet -- assets/data/gallery-index.json; then
            echo "Gallery index unchanged, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/gallery-index.json
          git commit -m "chore: update gallery index"

          target_branch="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$target_branch"
          git push origin HEAD:"$target_branch"

      # I commit fatti con GITHUB_TOKEN non generano eventi, quindi il deploy
      # non riparte da solo dopo che i workflow hanno aggiornato gli indici e
      # il sito resta indietro di un giro. Una chiamata esplicita a
      # workflow_dispatch, invece, funziona anche con quel token.
      - name: Trigger site deploy
        if: always()
        run: gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME:-main}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
