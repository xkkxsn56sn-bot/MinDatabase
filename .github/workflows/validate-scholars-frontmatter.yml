name: Validate Scholars Front Matter

on:
  pull_request:
    paths:
      - "Content/**/*.md"
      - "scripts/validate_scholars_frontmatter.py"
      - ".github/workflows/validate-scholars-frontmatter.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "Content/**/*.md"
      - "scripts/validate_scholars_frontmatter.py"
      - ".github/workflows/validate-scholars-frontmatter.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate scholar links in front matter
        run: python scripts/validate_scholars_frontmatter.py
