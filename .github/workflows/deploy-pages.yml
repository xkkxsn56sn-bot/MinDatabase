name: Deploy Site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.html"
      - "Content/**"
      # I .md nella radice sono pagine del sito come le altre: glossary.md
      # (/glossary/, in nav), dating-systems.md (/dating-systems/) e le
      # istruzioni per gli agenti. Senza questa riga un commit che tocca solo
      # uno di loro non fa ripartire il deploy, e la pagina resta indietro
      # senza che nulla lo segnali.
      # Il glob e' volutamente la sola radice: '*' non attraversa '/', quindi
      # non pesca drafts/*.md, che e' escluso dalla build e produrrebbe
      # deploy a vuoto. Le schede sono gia' coperte da 'Content/**'.
      - "*.md"
      - "assets/**"
      - "Images/**"
      - "Thumbnails/**"
      - "_layouts/**"
      - "_includes/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "CNAME"
      - "robots.txt"
      - "404.html"
      # Cloudflare Workers Static Assets (job deploy-cloudflare, sotto).
      - "_headers"
      - ".assetsignore"
      - "wrangler.site.toml"
      - "cloudflare/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build esplicito invece di actions/jekyll-build-pages: quest'ultima usa
      # le versioni che GitHub decide, ignorando il Gemfile del repo. Con
      # bundler la build in produzione usa esattamente le versioni fissate in
      # Gemfile.lock, cioe' le stesse con cui si costruisce in locale.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tappa 1 della migrazione a Cloudflare: lo stesso sito pubblicato anche su
  # Cloudflare Workers Static Assets, al solo indirizzo *.workers.dev
  # (wrangler.site.toml: nessuna route, nessun dominio personalizzato).
  # Job separato perche' il deploy su GitHub Pages resti identico: costruisce
  # di nuovo il sito con lo stesso Gemfile.lock, fa girare i quattro
  # validatori e pubblica _site con wrangler. Non scrive commit e non tocca
  # push_notices.json: nessuna notizia, nessuna newsletter.
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate content indexes
        run: python scripts/validate_content_indexes.py

      - name: Validate scholars front matter
        run: python scripts/validate_scholars_frontmatter.py

      - name: Validate reachability
        run: python scripts/validate_reachability.py

      - name: Validate nav consistency
        run: python scripts/validate_nav_consistency.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare (workers.dev)
        run: npx --yes wrangler@4 deploy --config wrangler.site.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
