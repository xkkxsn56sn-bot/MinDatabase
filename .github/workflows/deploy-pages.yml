name: Deploy Site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.html"
      - "Content/**"
      # I .md nella radice sono pagine del sito come le altre: glossary.md
      # (/glossary/, in nav), dating-systems.md (/dating-systems/) e le
      # istruzioni per gli agenti. Senza questa riga un commit che tocca solo
      # uno di loro non fa ripartire il deploy, e la pagina resta indietro
      # senza che nulla lo segnali.
      # Il glob e' volutamente la sola radice: '*' non attraversa '/', quindi
      # non pesca drafts/*.md, che e' escluso dalla build e produrrebbe
      # deploy a vuoto. Le schede sono gia' coperte da 'Content/**'.
      - "*.md"
      - "assets/**"
      - "Images/**"
      - "Thumbnails/**"
      - "_layouts/**"
      - "_includes/**"
      - "_config.yml"
      - "_config.production.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "CNAME"
      - "robots.txt"
      - "404.html"
      # Cloudflare Workers Static Assets (job deploy-cloudflare).
      - "_headers"
      - ".assetsignore"
      - "wrangler.site.toml"
      - "cloudflare/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  # Il sito e' servito da Cloudflare Workers Static Assets: il Worker
  # medievalvisions-site (wrangler.site.toml) risponde su www.medievalvisions.com
  # come dominio personalizzato e anche su *.workers.dev. GitHub Pages e' spento
  # (tappa 4 della migrazione): questo e' l'unico deploy.
  # Il job costruisce il sito con Gemfile.lock (bundler, non
  # actions/jekyll-build-pages, cosi' le versioni sono le stesse della build
  # locale), fa girare i quattro validatori e pubblica _site con wrangler.
  # Non scrive commit e non tocca push_notices.json: nessuna notizia, nessuna
  # newsletter.
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config.production.yml --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate content indexes
        run: python scripts/validate_content_indexes.py

      - name: Validate scholars front matter
        run: python scripts/validate_scholars_frontmatter.py

      - name: Validate reachability
        run: python scripts/validate_reachability.py

      - name: Validate nav consistency
        run: python scripts/validate_nav_consistency.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Workers (www.medievalvisions.com)
        run: npx --yes wrangler@4 deploy --config wrangler.site.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
