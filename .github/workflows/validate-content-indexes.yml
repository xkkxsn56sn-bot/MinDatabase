name: Validate Content Indexes

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Content/**"
      - "assets/data/*.json"
      - "scripts/validate_content_indexes.py"
      - ".github/workflows/validate-content-indexes.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate content indexes
        run: python scripts/validate_content_indexes.py
